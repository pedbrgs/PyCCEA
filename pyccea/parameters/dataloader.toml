# This file specifies the parameters of the DataLoader

[general]
splitter_type = "k_fold"
float_dtype = "float32"
verbose = true

[splitter]
preset = true
kfolds = 10
stratified = true

[normalization]
normalize = true
method = "min_max"

[preprocessing]
drop_na = true
winsorization = true
quantiles = [0.01, 0.99]